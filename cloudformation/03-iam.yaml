AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Stack 03 - IAM. Management EC2 role + instance profile (the identity that runs
  Terraform on the box), plus the separate application execution roles for
  Lambda and Step Functions. EC2 and Lambda never share a role.
  Terraform uses LOCAL state on the box, so there is no state bucket or lock
  table and no policy for them.
  Naming convention: <NamePrefix>_<type>_<NameSuffix>.

Parameters:
  NamePrefix:
    Type: String
    Default: mpa_sec

  NameSuffix:
    Type: String
    Default: oaidaybreak

  ExportPrefix:
    Type: String
    Default: mpa-sec-oaidaybreak

  AppResourcePattern:
    Type: String
    Default: mpa-sec-*-oaidaybreak
    Description: >
      Hyphenated name pattern for the Lambda / Step Functions / CloudFormation
      resources Terraform will create, used to scope the policies below.
      Hyphens because these names feed ARNs and S3-style identifiers.

  ArtifactBucketName:
    Type: String
    Default: mpa-sec-s3-artifacts-oaidaybreak
    Description: >
      Bucket for build artifacts / Lambda packages. Created later by Terraform;
      named here so the policy can be scoped to it up front.
      Hyphenated: S3 bucket names may not contain underscores.

  BucketNamePattern:
    Type: String
    Default: mpa-sec-s3-*-oaidaybreak
    Description: Pattern for buckets Terraform is allowed to create.

  BedrockModelIdPattern:
    Type: String
    Default: '*'
    Description: >
      Foundation-model id pattern the application roles may invoke,
      e.g. 'anthropic.claude-*'. Default '*' allows any model in-region.

Resources:
  # ============================================================
  # Application roles -- created first so PassRole can be scoped
  # to exactly these ARNs.
  # ============================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}_role_lambda_${NameSuffix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs, plus ENI management for VPC-attached functions.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: s3-artifacts-and-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelIdPattern}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}_role_lambda_${NameSuffix}'

  StepFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}_role_sfn_${NameSuffix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppResourcePattern}'
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelIdPattern}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
        - PolicyName: logging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The X-Ray / CloudWatch Logs delivery APIs Step Functions uses
              # are account-level and do not accept a resource restriction.
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}_role_sfn_${NameSuffix}'

  # ============================================================
  # Management EC2 role -- runs Terraform for the remaining layers
  # ============================================================

  ManagementEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}_role_mgmt_ec2_${NameSuffix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # ---- S3: artifacts + Terraform state ----
        - PolicyName: s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
              # Terraform creates the remaining buckets.
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketPolicy
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetLifecycleConfiguration
                  - s3:GetBucketAcl
                  - s3:GetBucketCORS
                  - s3:GetBucketLogging
                  - s3:GetBucketObjectLockConfiguration
                  - s3:GetBucketRequestPayment
                  - s3:GetBucketWebsite
                  - s3:GetAccelerateConfiguration
                  - s3:GetReplicationConfiguration
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketNamePattern}'

        # ---- Lambda ----
        - PolicyName: lambda-manage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetPolicy
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:InvokeFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:ListVersionsByFunction
                  - lambda:CreateAlias
                  - lambda:UpdateAlias
                  - lambda:DeleteAlias
                  - lambda:GetAlias
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppResourcePattern}'
              - Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - lambda:GetAccountSettings
                  - lambda:CreateEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetLayerVersion
                  - lambda:PublishLayerVersion
                  - lambda:DeleteLayerVersion
                Resource: '*'

        # ---- Step Functions ----
        - PolicyName: stepfunctions-manage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:UpdateStateMachine
                  - states:DeleteStateMachine
                  - states:DescribeStateMachine
                  - states:StartExecution
                  - states:StartSyncExecution
                  - states:StopExecution
                  - states:TagResource
                  - states:UntagResource
                  - states:ListTagsForResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AppResourcePattern}'
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AppResourcePattern}:*'
              - Effect: Allow
                Action:
                  - states:ListStateMachines
                  - states:DescribeExecution
                  - states:ListExecutions
                  - states:GetExecutionHistory
                Resource: '*'

        # ---- CloudFormation (this box can also drive CFN stacks) ----
        - PolicyName: cloudformation-manage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppResourcePattern}/*'
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                  - cloudformation:ValidateTemplate
                Resource: '*'

        # ---- PassRole, restricted to the two application roles ----
        - PolicyName: pass-application-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt LambdaExecutionRole.Arn
                  - !GetAtt StepFunctionExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - states.amazonaws.com
                      - cloudformation.amazonaws.com

        # ---- Read-only IAM, so Terraform can refresh the roles above ----
        - PolicyName: iam-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                Resource: '*'

        # ---- CloudWatch Logs for Terraform-managed log groups ----
        - PolicyName: logs-manage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/*'
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

        # ---- Bedrock: list models + invoke, for smoke tests from the box ----
        - PolicyName: bedrock-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                  - bedrock:ListInferenceProfiles
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelIdPattern}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'

        # ---- Read-only EC2/VPC describes, needed by every terraform plan ----
        - PolicyName: ec2-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:Describe*
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}_role_mgmt_ec2_${NameSuffix}'

  ManagementEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${NamePrefix}_instprof_mgmt_ec2_${NameSuffix}'
      Roles:
        - !Ref ManagementEC2Role

Outputs:
  ManagementEC2RoleArn:
    Value: !GetAtt ManagementEC2Role.Arn
    Export:
      Name: !Sub '${ExportPrefix}-ManagementEC2RoleArn'

  ManagementEC2InstanceProfileName:
    Value: !Ref ManagementEC2InstanceProfile
    Export:
      Name: !Sub '${ExportPrefix}-ManagementEC2InstanceProfileName'

  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${ExportPrefix}-LambdaExecutionRoleArn'

  StepFunctionExecutionRoleArn:
    Value: !GetAtt StepFunctionExecutionRole.Arn
    Export:
      Name: !Sub '${ExportPrefix}-StepFunctionExecutionRoleArn'
